# Per-term change list: departures, new hires, additions, and cancellations.
# Everything else
# (grouping four-credit/hybrid/coreq/cross-listed pairs, reassigning a
# departed instructor's other sections, keeping section-vs-course
# identity straight) is worked out automatically by
# class_schedule.term_builder.build_draft_schedule from last term's
# schedule file plus this file.
#
# Copy this file per term (e.g. inputs/27S/changes.toml) and run:
#
#   uv run class-schedule --config config draft 27S `
#     work/27S/normalized/sections.csv inputs/27S/changes.toml
#
# The output is a *draft* -- pass it to `class-schedule solve` to see
# conflicts, run the solver, and check overload.
# This file never writes persons.toml or preferences.toml -- names in
# `departures` below still need their [[persons]] blocks removed by hand.
# The draft command reports names that do not occur in the source schedule,
# which usually indicates a typo.

# ---- who left ----------------------------------------------------------
# Exact name as it appears in the *template* schedule's Instructor column
# -- same spelling as persons.toml's own `name` field, e.g.
# "Bain, Leslie M.", not the short alias "Bain". Every section this
# person was teaching in the template gets reassigned to the placeholder
# instructor below (left open, not deleted) rather than removed -- the
# course is usually still needed, just needs a new teacher.
departures = [
  # "Bain, Leslie M.",
]

# ---- who's newly hired --------------------------------------------------
# Exact name as it appears in persons.toml's own `name` field. Doesn't
# touch the draft schedule by itself (unlike departures above) -- read by
# class_schedule.starting_template.place_new_hires, which tries to seat
# each of these people into the draft up to their own max_load: first by
# taking over an open ("Staff") position they're qualified for, then --
# only if no open position is qualified/non-conflicting -- by taking a
# position from an instructor currently over their own max_load. If
# neither is possible for a given slot, placement just stops there rather
# than forcing an assignment; whatever's left unplaced stays open for the
# solver to sort out later. A name added to persons.toml for future
# planning but not actually confirmed hired yet should NOT go here.
new_hires = [
  # "Yousuf, Marium",
]

# ---- courses to cancel --------------------------------------------------
# Drop matching rows from the template outright. Omit `section` to cancel
# every section of that course number.
#
# [[cancel_courses]]
# subject = "MATH"
# number = "0803"
# section = "003"
#
# [[cancel_courses]]
# subject = "MATH"
# number = "2243"
# # no section -> cancels every MATH 2243 section in the template

# ---- new courses to add --------------------------------------------------
# One table per CSV row -- same fields as an uploaded schedule file
# (Subject/Number/Section required; physical meetings need "Time Slot" --
# or Days+Start -- plus Duration -- or Start+End). Leave
# Instructor blank/omitted to have it filled with the placeholder
# ("Staff" by default): after solving, any section still assigned to the
# placeholder is exactly the "nobody on staff is qualified/available for
# this" signal to act on -- add that course to an existing person's
# `courses` list in persons.toml, or count it toward a hiring need. Give
# it a real Days/Start/Duration when a physical meeting must be scheduled.
# ONLINE/TBA/blank-time rows keep their delivery/time/room unchanged, but
# the solver can still replace Staff with a qualified instructor.
#
# Multi-row offerings use the same strict atomic rules as CSV input:
# same-course/section MWF+T/R for four-credit, an M/F-prefixed physical plus
# non-physical row for Hybrid, a shared Cross-List/known pair for cross-list,
# or a whitelisted same-section coreq pair. List both source rows.
#
# [[new_courses]]
# Subject = "MATH"
# Number = "1013"
# Section = "001"
# Type = "Lecture"
# Title = "NEW COURSE TITLE"
# Credits = 3
# "Time Slot" = "MWF 9:00am"
# Duration = 50
# Room = ""
# Building = ""
# Instructor = ""
