[project]
name = "class-schedule"
version = "0.1.0"
description = "A clear Python API for editing, validating, and exporting class schedules"
readme = "README.md"
authors = [
    { name = "Xinli Xiao", email = "xiaoxinlixxl@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.3",
    "psutil>=6.0,<8",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
class-schedule = "class_schedule.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
