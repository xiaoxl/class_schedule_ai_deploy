# Per-term soft preferences. Every matching rule is a standalone dictionary.
# A named rule is scoped by its own `name`; nearby `# Name` comments only make
# the file easier to scan and have no effect on parsing.
#
# `preferred_*` fields reward matching candidates and `disliked_*` fields
# penalize them. Each rule must use exactly one direction and set weight from
# 0 through 100. Fields within one rule are ANDed. Rules without `name` are
# global.
#
# Instructor profiles contain only non-selector policy settings. max_load and
# qualifications remain in persons.toml. allow_overload changes the flat soft
# penalty only; overload begins above max_load + 2 and is never a hard block.

# Global
# MATH 1113-F01 should use Corley 269 regardless of instructor.
[[rules]]
preferred_course = "MATH 1113"
preferred_section = "F01"
preferred_room = "Corley 269"
weight = 100

