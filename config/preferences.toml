# Per-term instructor preferences. Never set or override the contractual
# max_load here -- that belongs in persons.toml.
# name must exactly match persons.toml -- no abbreviations, no reordering.
# Locations/rooms use the CSV's own full spelling, e.g. Corley, Rothwell,
# Ross Pendergraft Library, and Corley 101, Rothwell 221.
# preferred_courses/disliked_courses use persons.toml's own "SUBJECT NUMBER"
# course convention (e.g. "MATH 0903"), not a full course id with section.
#
# allow_overload: true means this instructor is fine with going over
# max_load, false means avoid it (penalty 100, this system's practical
# ceiling). Either way it's always soft -- not a hard block -- and it
# never applies within +2 credit hours of max_load; that's the
# definition of overload, not something this knob can loosen or tighten.
#
# instructors.rules -- free-form soft rules for this instructor beyond the
# fixed fields above (course/section/room/time-scoped, any combination of
# those you fill in; leaving one out means "matches anything"). Each rule
# needs `direction` ("prefer" or "dislike") and `weight` (how strongly).
# `weight` is on the same 0-100 scale as every penalty in this system --
# 100 is the practical ceiling, just below under_load (this system's
# strongest penalty):
#   10  -- a little
#   50  -- a lot
#   100 -- as strong as this system's soft rules go -- still not a hard
#          guarantee, but as close as this mechanism gets
#
#   [[instructors.rules]]
#   room = "Corley 269"
#   direction = "prefer"
#   weight = 100
#
#   [[instructors.rules]]
#   course = "MATH 1113"
#   time = { days = ["T", "R"], between = ["08:00", "09:30"] }
#   direction = "dislike"
#   weight = 10
#
# A rule with no instructor at all -- applies no matter who ends up
# teaching the match, e.g. a specific course-section pinned to a room
# regardless of instructor -- goes in a top-level [[rules]] list instead
# of under any one [[instructors]] block:
#
#   [[rules]]
#   course = "MATH 1113"
#   section = "F01"
#   room = "Corley 269"
#   direction = "prefer"
#   weight = 100

