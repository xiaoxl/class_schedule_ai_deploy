# FORMAT AND KEYWORDS
#
# Top level:
#   staff_count_weight = 0..100
#     Cost for every distinct Staff/Staff N identity used in the whole
#     schedule. A larger value favors changing times to use fewer Staff
#     identities. Hard conflicts may still require additional Staff.
#
# Instructor profile (policy only, one per person):
#   [[instructors]]
#   name = "Exact persons.toml name"
#   allow_overload = true|false
#   allow_back_to_back = true|false
#   max_back_to_back = nonnegative integer       # optional
# max_load, aliases, and course qualifications belong in persons.toml.
#
# One soft matching preference per flat dictionary:
#   [[rules]]
#   name = "Exact instructor name"               # omit for a global rule
#   course = "MATH 1113"
#   section = "F01"
#   section_prefix = "TC"
#   room = "Corley 101"                          # or ["Corley 101", "Corley 102"]
#   time = "8-12"
#   weight = 50                                  # like; -50 means dislike
#
# Selector fields in one rule are ANDed. `section` requires `course`;
# `section` and `section_prefix` cannot coexist. Room accepts one string or a
# string array. Time can be the all-weekday
# shorthand "8-12" or a table such as
# { days = ["M", "W", "F"], between = ["08:00", "09:00"], reason = "text" }.
# Every rule carries a nonzero signed weight in [-100, 100]. Positive means
# preferred and is subtracted from solver cost; negative means disliked and
# its magnitude is added. Rules with no name are global.
# Online/web courses use section codes beginning with TC. Express that
# preference with section_prefix = "TC" and a positive or negative weight.
# Nearby `# Name` comments only group the file visually and have no meaning.
# allow_overload only changes a soft penalty; overload begins above
# max_load + 2 and is never a hard block.

staff_count_weight = 100

